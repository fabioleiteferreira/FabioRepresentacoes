<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo comercial</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><div class="brand"><img id="logo" class="logo hidden" alt="Logotipo"><div><h1 id="storeName">Catálogo comercial</h1><p id="tagline">Materiais para construção</p></div></div><a class="adminLink" id="adminLink" href="/admin.html">Área do representante</a></header><main class="wrap"><section class="hero"><h2>Faça seu pedido</h2><p>Escolha os produtos e envie seu pedido ao representante.</p><input id="search" placeholder="Buscar produto por nome, código ou categoria" oninput="renderProducts()"></section><section><div id="products" class="products"></div></section><section class="panel"><h2>Seu pedido</h2><div id="cart"></div><h3 id="total">R$ 0,00</h3><div class="formgrid"><input id="customerName" placeholder="Seu nome *" required><input id="phone" placeholder="WhatsApp/telefone *" required><input id="email" placeholder="E-mail (opcional)"><input id="address" placeholder="Endereço para entrega"><textarea id="notes" placeholder="Observações do pedido"></textarea></div><button class="primary" onclick="submitOrder()">Enviar pedido</button><p id="message" role="status"></p></section></main><footer>Pedido comercial sujeito à confirmação de estoque, preço e entrega. Este documento não é nota fiscal eletrônica.</footer><script src="/store.js"></script></body></html>
