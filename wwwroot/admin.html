<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><div><h1>Área do representante</h1><p>Entre com seu acesso para administrar sua própria loja.</p></div><a href="/index.html">Ver catálogo</a></header><main class="wrap"><section id="loginBox" class="panel narrow"><h2>Entrar</h2><form id="loginForm"><label>E-mail<input id="email" type="email" required autocomplete="username"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button class="primary">Entrar</button><p id="loginMessage" role="status"></p></form><p class="muted">Demonstração inicial: fabio@demo.local / Demo@12345. Troque antes de qualquer uso real.</p></section><section id="adminApp" class="hidden"><div class="adminHead panel"><div><h2 id="tenantName">Minha loja</h2><p id="tenantUrl"></p></div><button onclick="logout()">Sair</button></div><nav class="tabs"><button onclick="tab('orders')">Pedidos</button><button onclick="tab('products')">Produtos e estoque</button><button onclick="tab('customers')">Clientes</button><button onclick="tab('trash')">Lixeira</button><button onclick="tab('settings')">Minha loja e logotipo</button></nav><div id="stats" class="stats"></div><section id="content" class="panel"></section></section></main><script src="/admin.js"></script></body></html>
